name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python tests
        run: python -m unittest discover -s tests -t . -v
      - name: Plugin tests
        run: node --test tests/*.test.js tests/*.test.ts
      - name: CLI smoke test
        run: |
          bin/herdr-codexbar --version
          bin/herdr-codexbar --help
